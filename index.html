<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR-этикетка оборудования — ЛР №4</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    .arjs-loader {
      height: 100%; width: 100%; position: absolute; top: 0; left: 0;
      background-color: rgba(0, 0, 0, 0.8); z-index: 9999; display: flex;
      justify-content: center; align-items: center; color: white; font-size: 1.1em;
      text-align: center; padding: 20px; box-sizing: border-box;
    }
    #hint {
      position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
      color: #fff; text-shadow: 0 1px 3px #000; font-size: 15px; z-index: 50;
      pointer-events: none;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">
  <div class="arjs-loader">
    <div>Загрузка AR... Разрешите доступ к камере.<br>Наведите камеру на маркер Hiro.</div>
  </div>
  <div id="hint">ЛР №4 — AR-этикетка лабораторного оборудования (вариант: маркер Hiro)</div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    loading-screen="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  >
    <a-assets>
      <!-- Карточка рисуется на canvas: стандартный шрифт A-Frame не содержит кириллицу -->
      <canvas id="card" width="1024" height="640"></canvas>
    </a-assets>

    <a-marker preset="hiro" id="marker" emitevents="true">

      <!-- информационная карточка (лежит на маркере) -->
      <a-plane
        id="cardPlane"
        position="0 0.02 0"
        rotation="-90 0 0"
        width="1.6" height="1"
        material="src: #card; transparent: false; side: double"
      ></a-plane>

      <!-- простая 3D-подсказка: вращающийся индикатор состояния -->
      <a-cylinder
        position="0.95 0.25 0"
        radius="0.08" height="0.5"
        color="#2ecc71"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
      ></a-cylinder>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // --- Рисуем карточку на canvas (поддерживает кириллицу системными шрифтами) ---
    (function drawCard() {
      var c = document.getElementById('card');
      var g = c.getContext('2d');
      g.fillStyle = '#102a43';
      g.fillRect(0, 0, c.width, c.height);
      g.strokeStyle = '#4f8ec9';
      g.lineWidth = 6;
      g.strokeRect(10, 10, c.width - 20, c.height - 20);
      g.textBaseline = 'top';

      g.fillStyle = '#ffffff';
      g.font = 'bold 60px Arial, Helvetica, sans-serif';
      g.fillText('Фрезерный станок ФС-12', 50, 40);

      g.fillStyle = '#d9e6f2';
      g.font = '38px Arial, Helvetica, sans-serif';
      g.fillText('СТАНКИН, лаб. 204', 50, 120);

      g.fillStyle = '#9fc5e8';
      g.font = '40px Arial, Helvetica, sans-serif';
      var lines = [
        'Напряжение: 380 В',
        'Макс. об/мин: 2800',
        'Техобслуживание: раз в 6 мес.',
        'Ответственный: лаборант каф. ИС'
      ];
      for (var i = 0; i < lines.length; i++) {
        g.fillText(lines[i], 50, 200 + i * 62);
      }

      g.fillStyle = '#ffd166';
      g.font = 'bold 36px Arial, Helvetica, sans-serif';
      g.fillText('Внимание: перед работой — инструктаж по ТБ', 50, 540);
    })();

    // Если текстура уже создана до отрисовки — просим перерисовать
    document.querySelector('a-scene').addEventListener('loaded', function () {
      var mesh = document.getElementById('cardPlane').getObject3D('mesh');
      if (mesh && mesh.material && mesh.material.map) { mesh.material.map.needsUpdate = true; }
    });

    // --- Оверлей «Загрузка AR...» сам не исчезает: убираем вручную ---
    var loader = document.querySelector('.arjs-loader');
    var hint = document.getElementById('hint');
    var HINT_IDLE = 'Наведите камеру на маркер Hiro';
    var HINT_FOUND = 'Маркер найден ✔';
    var markerVisible = false;

    function hideLoader() {
      if (loader) { loader.style.display = 'none'; }
      if (hint && !markerVisible) { hint.textContent = HINT_IDLE; }
    }

    window.addEventListener('arjs-video-loaded', hideLoader);
    window.addEventListener('load', function () { setTimeout(hideLoader, 4000); });

    document.addEventListener('DOMContentLoaded', function () {
      var marker = document.getElementById('marker');
      marker.addEventListener('markerFound', function () {
        markerVisible = true;
        hideLoader();
        if (hint) { hint.textContent = HINT_FOUND; }
      });
      marker.addEventListener('markerLost', function () {
        markerVisible = false;
        if (hint) { hint.textContent = HINT_IDLE; }
      });
    });
  </script>
</body>
</html>
